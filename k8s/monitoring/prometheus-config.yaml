apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sre-task-api
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/alert-rules.yml

    scrape_configs:
      - job_name: "sre-task-api"
        metrics_path: "/actuator/prometheus"
        static_configs:
          - targets: ["sre-task-api:8080"]

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]